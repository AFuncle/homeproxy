name: Build IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_URL: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
      SDK_NAME: openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget

      - name: Download SDK
        run: |
          wget -q $SDK_URL
          tar -xf $(basename $SDK_URL)
          mv $SDK_NAME sdk

      - name: Setup feeds
        run: |
          cd sdk
          echo "src-git packages https://git.openwrt.org/feed/packages.git" > feeds.conf
          echo "src-git luci https://git.openwrt.org/project/luci.git" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy source
        run: |
          mkdir -p sdk/package/luci-app-homeproxy
          cp -r $(ls -A | grep -v sdk) sdk/package/luci-app-homeproxy/

      - name: Build
        run: |
          cd sdk
          make defconfig
          echo "CONFIG_LUCI_JSMIN=n" >> .config
          make package/luci-app-homeproxy/compile V=s -j$(nproc)

      - name: Collect packages
        run: |
          mkdir -p artifacts
          find sdk/bin -name "luci-app-homeproxy*.ipk" -exec cp {} artifacts/ \;
          find sdk/bin -name "luci-i18n-homeproxy*.ipk" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy
          path: artifacts/*.ipk

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
